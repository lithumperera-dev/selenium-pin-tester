<!DOCTYPE html>
<html>
<head>
    <title>Test Login</title>
</head>

<body>

    <h2>Test Login</h2>

    <input type="password" id="password" placeholder="Enter PIN">
    <button id="login" onclick="checkPassword()">Login</button>

    <p id="result"></p>

    <script>
        function checkPassword() {

            const correctPassword = "0427";

            const enteredPassword =
                document.getElementById("password").value;

            if (enteredPassword === correctPassword) {
                document.getElementById("result").innerHTML =
                    "Correct password!";
            } else {
                document.getElementById("result").innerHTML =
                    "Wrong password";
            }
        }
    </script>

</body>
</html>
